<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIVO — Tu Recuerdo Permanece</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      transition: background-color 0.8s ease;
    }
    #card-content {
      transition: background-color 0.8s ease, color 0.4s ease, opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(20px) scale(0.98);
    }
    
    /* La Cortina de Revelación */
    #cortina-vivo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0f172a; /* Slate 900 base */
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      cursor: pointer;
    }
    
    .anim-pulse-slow {
      animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    /* Efecto de anillo expansivo al tocar */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(0);
      animation: rippleEffect 0.6s linear;
      pointer-events: none;
    }
    
    @keyframes rippleEffect {
      to { transform: scale(4); opacity: 0; }
    }
  </style>
</head>
<body id="body-bg" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 font-sans overflow-hidden">

  <!-- CORTINA VIVO (Pantalla inicial interactiva) -->
  <div id="cortina-vivo">
    
    <!-- Fase 1: Cargando (Spinner oculto por defecto, visible si tarda) -->
    <div id="loader-estado" class="flex flex-col items-center justify-center opacity-100 transition-opacity duration-300">
      <div id="spinner-color" class="w-10 h-10 border-2 border-slate-700 border-t-white rounded-full animate-spin mb-4"></div>
      <p class="text-slate-400 text-xs tracking-widest uppercase font-semibold">Sincronizando recuerdo</p>
    </div>
    
    <!-- Fase 2: Listo para revelar (Opción A modificada) -->
    <div id="revelar-estado" class="hidden flex-col items-center justify-center anim-pulse-slow text-center">
      <span class="text-[10px] font-bold tracking-[0.3em] text-white/50 mb-4 uppercase">VIVO Memories</span>
      <div class="w-20 h-20 rounded-full bg-white/5 border border-white/20 flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(255,255,255,0.1)]">
        <i class="fa-solid fa-fingerprint text-3xl text-white opacity-80"></i>
      </div>
      <h2 class="text-xl font-bold text-white tracking-widest mb-2 uppercase">Toca para revelar</h2>
      <p class="text-slate-400 text-xs font-light tracking-wide">Tu recuerdo está VIVO.</p>
    </div>
    
  </div>

  <!-- Contenedor Principal (Tarjeta Flotante VIVO) -->
  <main id="card-content" class="w-full max-w-md rounded-3xl p-6 sm:p-7 shadow-2xl space-y-6 my-auto">
    
    <!-- Encabezado y Titular -->
    <header class="text-center space-y-1.5">
      <span id="subtitulo" class="text-xs uppercase tracking-widest font-semibold block"></span>
      <h1 id="titulo" class="text-2xl sm:text-3xl font-extrabold tracking-tight"></h1>
      <div id="divider" class="w-14 h-1 mx-auto rounded-full mt-2 mb-1"></div>
    </header>

    <!-- Galería / Foto Principal -->
    <section id="sec-fotos" class="hidden space-y-3">
      <div class="relative overflow-hidden rounded-2xl shadow-md aspect-square bg-slate-100 border border-black/5">
        <img id="foto-activa" src="" alt="Recuerdo" class="w-full h-full object-cover transition-all duration-500">
      </div>
    </section>

    <!-- Dedicatoria y Mensaje Especial -->
    <section id="sec-mensaje" class="hidden space-y-2.5 text-center p-4 sm:p-5 rounded-2xl border transition-colors">
      <p id="dedicatoria" class="text-sm sm:text-base italic leading-relaxed font-serif"></p>
      <p id="mensaje-especial" class="text-xs font-light"></p>
    </section>

    <!-- Música / Audio / Video Integrado -->
    <section id="sec-spotify" class="hidden space-y-2">
      <p id="lbl-musica" class="text-xs font-semibold uppercase tracking-wider flex items-center gap-2">
        <i id="icon-music" class="fa-solid fa-music"></i> Audio del Recuerdo
      </p>
      <div id="spotify-container" class="rounded-2xl overflow-hidden shadow-sm"></div>
    </section>

    <!-- Pie de Página: Identidad VIVO -->
    <footer id="card-footer" class="pt-5 border-t text-center">
      <a href="https://vivo.soigroupcr.com" target="_blank" class="inline-flex flex-col items-center gap-0.5 transition-opacity hover:opacity-75">
        <span id="footer-lema" class="text-[10px] tracking-widest uppercase font-medium">Tu recuerdo permanece</span>
        <span id="footer-logo" class="font-black tracking-[0.25em] text-sm">V I V O</span>
        <span id="footer-sub" class="text-[9px] tracking-wider uppercase opacity-60">por Sōi Group</span>
      </a>
    </footer>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD20eQRuXkW3ayx5l49lvd8nJ-X7Mar-WA",
      authDomain: "soi-nfc-db.firebaseapp.com",
      projectId: "soi-nfc-db",
      storageBucket: "soi-nfc-db.firebasestorage.app",
      messagingSenderId: "421798963104",
      appId: "1:421798963104:web:d6f0a37729d6d2eb86a6c5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const recuerdoId = urlParams.get('id');

    // Variables globales para la carga
    let datosCargados = false;
    let configuracionGlobal = {};

    function esColorClaro(hex) {
      if (!hex) return false;
      const cleanHex = hex.replace('#', '');
      const r = parseInt(cleanHex.substring(0, 2), 16) || 0;
      const g = parseInt(cleanHex.substring(2, 4), 16) || 0;
      const b = parseInt(cleanHex.substring(4, 6), 16) || 0;
      return ((r * 299 + g * 587 + b * 114) / 1000) >= 140;
    }

    function extraerYoutubeId(url) {
      if (!url) return '';
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url.trim();
    }

    // 1. Iniciar la extracción de datos desde Firebase
    async function precargarDatos() {
      if (!recuerdoId) {
        document.getElementById('loader-estado').innerHTML = '<p class="text-red-400">Error: ID no especificado en el chip NFC.</p>';
        return;
      }
      try {
        const docRef = doc(db, "recuerdos", recuerdoId);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          document.getElementById('loader-estado').innerHTML = '<p class="text-red-400">El recuerdo no fue encontrado.</p>';
          return;
        }

        configuracionGlobal = docSnap.data();
        datosCargados = true;
        prepararCortina(configuracionGlobal);

      } catch (error) {
        document.getElementById('loader-estado').innerHTML = `<p class="text-red-400 text-xs text-center max-w-[80%]">Error de conexión.</p>`;
      }
    }

    // 2. Transición del Loader a la Huella Dactilar
    function prepararCortina(info) {
      const cortina = document.getElementById('cortina-vivo');
      
      // Aplicar color de fondo suave a la cortina según la paleta elegida
      const colorBase = info.colorFondo || '#F0F4F8';
      const esClara = esColorClaro(colorBase);
      cortina.style.backgroundColor = colorBase;
      
      const loader = document.getElementById('loader-estado');
      const revelar = document.getElementById('revelar-estado');
      
      // Ajustar colores del texto de la cortina para contraste
      const textColor = esClara ? '#1e293b' : '#ffffff';
      const subTextColor = esClara ? 'rgba(30,41,59,0.5)' : 'rgba(255,255,255,0.5)';
      
      revelar.querySelector('span').style.color = subTextColor;
      revelar.querySelector('h2').style.color = textColor;
      revelar.querySelector('p').style.color = textColor;
      revelar.querySelector('i').style.color = textColor;
      revelar.querySelector('.w-20').style.borderColor = esClara ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.2)';
      revelar.querySelector('.w-20').style.backgroundColor = esClara ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.05)';

      // Ocultar Loader y Mostrar la huella
      loader.classList.add('opacity-0');
      setTimeout(() => {
        loader.classList.add('hidden');
        revelar.classList.remove('hidden');
        revelar.classList.add('flex');
      }, 300);

      // 3. Activar el Evento de Clic en la cortina
      cortina.addEventListener('click', function(e) {
        crearEfectoRipple(e, cortina);
        abrirRecuerdo();
      });
    }

    function crearEfectoRipple(e, contenedor) {
      const circle = document.createElement('div');
      const diameter = Math.max(contenedor.clientWidth, contenedor.clientHeight);
      const radius = diameter / 2;
      circle.style.width = circle.style.height = `${diameter}px`; circle.style.left = `${e.clientX - radius}px`;
      circle.style.top = `${e.clientY - radius}px`; circle.classList.add('ripple'); contenedor.appendChild(circle); }  // 4. Construir la tarjeta y forzar el Autoplay function abrirRecuerdo() { const info = configuracionGlobal; const cortina = document.getElementById('cortina-vivo'); const card = document.getElementById('card-content');  // --- A. CONSTRUCCIÓN VISUAL --- const colorPrincipal = info.colorPrincipal \vert{}\vert{} '#81D4FA'; const colorSecundario = info.colorSecundario \vert{}\vert{} '#FFFFFF'; const colorFondo = info.colorFondo \vert{}\vert{} '#F0F4F8'; const esClara = esColorClaro(colorSecundario); const colorTexto = info.colorTexto \vert{}\vert{} (esClara ? '#0F172A' : '#FFFFFF'); const colorSubtexto = info.colorSubtexto \vert{}\vert{} (esClara ? '#475569' : '#E2E8F0');  document.body.style.backgroundColor = colorFondo; card.style.backgroundColor = colorSecundario; card.classList.add('border', esClara ? 'border-black/10' : 'border-white/10');  const elTitulo = document.getElementById('titulo'); const elSubtitulo = document.getElementById('subtitulo'); const secMensaje = document.getElementById('sec-mensaje'); const elDedicatoria = document.getElementById('dedicatoria'); const lblMusica = document.getElementById('lbl-musica'); const footerLogo = document.getElementById('footer-logo');  if (elTitulo) elTitulo.style.color = colorTexto; if (elDedicatoria) elDedicatoria.style.color = colorTexto; if (footerLogo) footerLogo.style.color = colorTexto; if (elSubtitulo) elSubtitulo.style.color = colorSubtexto; if (lblMusica) lblMusica.style.color = colorSubtexto;  if (secMensaje) { secMensaje.style.backgroundColor = esClara ? 'rgba(0, 0, 0, 0.04)' : 'rgba(255, 255, 255, 0.08)'; secMensaje.style.borderColor = esClara ? 'rgba(0, 0, 0, 0.08)' : 'rgba(255, 255, 255, 0.15)'; }  document.getElementById('card-footer').style.borderColor = esClara ? 'rgba(0, 0, 0, 0.08)' : 'rgba(255, 255, 255, 0.15)'; document.getElementById('divider').style.backgroundColor = colorPrincipal;  // Textos y Foto if (elTitulo) elTitulo.textContent = info.titulo \vert{}\vert{} ''; if (elSubtitulo) elSubtitulo.textContent = info.subtitulo \vert{}\vert{} ''; if (info.dedicatoria) { elDedicatoria.textContent = `"${info.dedicatoria}"`;
        secMensaje.classList.remove('hidden');
      }

      if (info.fotoPrincipal) {
        document.getElementById('foto-activa').src = info.fotoPrincipal;
        document.getElementById('sec-fotos').classList.remove('hidden');
      }

      // --- B. REPRODUCTOR Y AUTOPLAY ---
      const trackRaw = info.audioId || info.spotifyTrackId;
      const plataforma = info.plataformaAudio || 'spotify';
      const modoVisual = info.modoReproductor || 'audio';
      const spotifyContainer = document.getElementById('spotify-container');

      if (trackRaw && spotifyContainer) {
        if (plataforma === 'mp3' || plataforma === 'dropbox') {
          // El atributo 'autoplay' ahora sí funcionará porque estamos dentro de un evento de clic
          spotifyContainer.innerHTML = `
            <div class="p-3 bg-black/10 rounded-2xl border border-black/5">
              <audio id="audio-nativo" controls autoplay class="w-full">
                <source src="${trackRaw}" type="audio/mpeg">
              </audio>
            </div>`;
            // Forzar play manual por si acaso
            setTimeout(() => { document.getElementById('audio-nativo')?.play().catch(e=>console.log("Autoplay mitigado por OS")); }, 100);

        } else if (plataforma === 'youtube' || plataforma === 'ytmusic') {
          const ytId = extraerYoutubeId(trackRaw);
          const isAudioBar = modoVisual === 'audio';
          // Se incluye ?autoplay=1
          spotifyContainer.innerHTML = `
            <div class="w-full ${isAudioBar ? 'h-20' :
