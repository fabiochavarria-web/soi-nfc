<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIVO — Tu Recuerdo Permanece</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      transition: background-color 0.4s ease;
    }
    #card-content {
      transition: background-color 0.4s ease, color 0.4s ease;
    }
  </style>
</head>
<body id="body-bg" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 font-sans">

  <!-- Estado de Carga -->
  <div id="loader" class="flex flex-col items-center justify-center min-h-[60vh]">
    <div id="spinner" class="w-12 h-12 border-4 border-slate-300 border-t-sky-400 rounded-full animate-spin mb-4"></div>
    <p class="text-slate-500 text-sm font-medium">Cargando experiencia digital...</p>
  </div>

  <!-- Contenedor Principal (Tarjeta Flotante VIVO) -->
  <main id="card-content" class="hidden w-full max-w-md rounded-3xl p-6 sm:p-7 shadow-2xl space-y-6 my-auto transition-all">
    
    <!-- Encabezado y Titular -->
    <header class="text-center space-y-1.5">
      <span id="subtitulo" class="text-xs uppercase tracking-widest font-semibold block"></span>
      <h1 id="titulo" class="text-2xl sm:text-3xl font-extrabold tracking-tight"></h1>
      <div id="divider" class="w-14 h-1 mx-auto rounded-full mt-2 mb-1"></div>
    </header>

    <!-- Galería / Foto Principal -->
    <section id="sec-fotos" class="hidden space-y-3">
      <div class="relative overflow-hidden rounded-2xl shadow-md aspect-square bg-slate-100 border border-black/5">
        <img id="foto-activa" src="" alt="Recuerdo" class="w-full h-full object-cover transition-all duration-500">
      </div>
      <div id="carrusel-thumbs" class="flex gap-2 justify-center overflow-x-auto py-1 hidden"></div>
    </section>

    <!-- Dedicatoria y Mensaje Especial -->
    <section id="sec-mensaje" class="hidden space-y-2.5 text-center p-4 sm:p-5 rounded-2xl border transition-colors">
      <p id="dedicatoria" class="text-sm sm:text-base italic leading-relaxed font-serif"></p>
      <p id="mensaje-especial" class="text-xs font-light"></p>
    </section>

    <!-- Música / Audio / Video Integrado -->
    <section id="sec-spotify" class="hidden space-y-2">
      <p id="lbl-musica" class="text-xs font-semibold uppercase tracking-wider flex items-center gap-2">
        <i id="icon-music" class="fa-solid fa-music"></i> Canción del Recuerdo
      </p>
      <div id="spotify-container" class="rounded-2xl overflow-hidden shadow-sm"></div>
    </section>

    <!-- Pie de Página: Identidad VIVO -->
    <footer id="card-footer" class="pt-5 border-t text-center">
      <a href="https://vivo.soigroupcr.com" target="_blank" class="inline-flex flex-col items-center gap-0.5 transition-opacity hover:opacity-75">
        <span id="footer-lema" class="text-[10px] tracking-widest uppercase font-medium">Tu recuerdo permanece</span>
        <span id="footer-logo" class="font-black tracking-[0.25em] text-sm">V I V O</span>
        <span id="footer-sub" class="text-[9px] tracking-wider uppercase opacity-60">por Sōi Group</span>
      </a>
    </footer>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD20eQRuXkW3ayx5l49lvd8nJ-X7Mar-WA",
      authDomain: "soi-nfc-db.firebaseapp.com",
      projectId: "soi-nfc-db",
      storageBucket: "soi-nfc-db.firebasestorage.app",
      messagingSenderId: "421798963104",
      appId: "1:421798963104:web:d6f0a37729d6d2eb86a6c5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const recuerdoId = urlParams.get('id');

    function esColorClaro(hex) {
      if (!hex) return false;
      const cleanHex = hex.replace('#', '');
      const r = parseInt(cleanHex.substring(0, 2), 16) || 0;
      const g = parseInt(cleanHex.substring(2, 4), 16) || 0;
      const b = parseInt(cleanHex.substring(4, 6), 16) || 0;
      return ((r * 299 + g * 587 + b * 114) / 1000) >= 140;
    }

    function extraerYoutubeId(url) {
      if (!url) return '';
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url.trim();
    }

    async function cargarRecuerdo() {
      if (!recuerdoId) {
        document.body.innerHTML = '<p class="text-center text-slate-400 mt-10">ID no especificado en la URL.</p>';
        return;
      }

      try {
        const docRef = doc(db, "recuerdos", recuerdoId);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          document.body.innerHTML = '<p class="text-center text-slate-400 mt-10">Recuerdo no encontrado en la base de datos.</p>';
          return;
        }

        const info = docSnap.data();

        // 1. Colores y Contraste
        const colorPrincipal = info.colorPrincipal || '#81D4FA';
        const colorSecundario = info.colorSecundario || '#FFFFFF';
        const colorFondo = info.colorFondo || '#F0F4F8';

        const esClara = esColorClaro(colorSecundario);
        const colorTexto = info.colorTexto || (esClara ? '#0F172A' : '#FFFFFF');
        const colorSubtexto = info.colorSubtexto || (esClara ? '#475569' : '#E2E8F0');

        document.body.style.backgroundColor = colorFondo;

        const card = document.getElementById('card-content');
        if (card) {
          card.style.backgroundColor = colorSecundario;
          card.classList.add('border', esClara ? 'border-black/10' : 'border-white/10');
        }

        // Aplicación segura de estilos de tipografía
        const elTitulo = document.getElementById('titulo');
        const elSubtitulo = document.getElementById('subtitulo');
        const secMensaje = document.getElementById('sec-mensaje');
        const elDedicatoria = document.getElementById('dedicatoria');
        const elMensajeEsp = document.getElementById('mensaje-especial');
        const lblMusica = document.getElementById('lbl-musica');
        const cardFooter = document.getElementById('card-footer');
        const footerLema = document.getElementById('footer-lema');
        const footerLogo = document.getElementById('footer-logo');
        const footerSub = document.getElementById('footer-sub');

        if (elTitulo) elTitulo.style.color = colorTexto;
        if (elDedicatoria) elDedicatoria.style.color = colorTexto;
        if (footerLogo) footerLogo.style.color = colorTexto;

        if (elSubtitulo) elSubtitulo.style.color = colorSubtexto;
        if (elMensajeEsp) elMensajeEsp.style.color = colorSubtexto;
        if (lblMusica) lblMusica.style.color = colorSubtexto;
        if (footerLema) footerLema.style.color = colorSubtexto;
        if (footerSub) footerSub.style.color = colorSubtexto;

        if (secMensaje) {
          secMensaje.style.backgroundColor = esClara ? 'rgba(0, 0, 0, 0.04)' : 'rgba(255, 255, 255, 0.08)';
          secMensaje.style.borderColor = esClara ? 'rgba(0, 0, 0, 0.08)' : 'rgba(255, 255, 255, 0.15)';
        }

        if (cardFooter) {
          cardFooter.style.borderColor = esClara ? 'rgba(0, 0, 0, 0.08)' : 'rgba(255, 255, 255, 0.15)';
        }

        const divider = document.getElementById('divider');
        if (divider) divider.style.backgroundColor = colorPrincipal;

        const spinner = document.getElementById('spinner');
        if (spinner) spinner.style.borderTopColor = colorPrincipal;

        // 2. Textos
        if (elTitulo) elTitulo.textContent = info.titulo || '';
        if (elSubtitulo) elSubtitulo.textContent = info.subtitulo || '';

        // 3. Foto Principal
        const secFotos = document.getElementById('sec-fotos');
        const imgActiva = document.getElementById('foto-activa');
        if (info.fotoPrincipal && imgActiva) {
          imgActiva.src = info.fotoPrincipal;
          secFotos?.classList.remove('hidden');
        }

        // 4. Mensajes
        let tieneMensaje = false;
        if (info.dedicatoria && elDedicatoria) {
          elDedicatoria.textContent = `"${info.dedicatoria}"`;
          tieneMensaje = true;
        }
        if (info.mensajeEspecial && elMensajeEsp) {
          elMensajeEsp.textContent = info.mensajeEspecial;
          tieneMensaje = true;
        }
        if (tieneMensaje && secMensaje) {
          secMensaje.classList.remove('hidden');
        }

        // 5. Audio / Video y Manejo de Nubes
        const trackRaw = info.audioId || info.spotifyTrackId;
        const plataforma = info.plataformaAudio || 'spotify';
        const modoVisual = info.modoReproductor || (plataforma === 'youtube' ? 'video' : 'audio');
        const secSpotify = document.getElementById('sec-spotify');
        const spotifyContainer = document.getElementById('spotify-container');

        if (trackRaw && spotifyContainer) {
          if (plataforma === 'mp3' || plataforma === 'dropbox') {
            // Reproductor Nativo Elegante (Dropbox / MP3 Directo)
            if (lblMusica) lblMusica.innerHTML = '<i id="icon-music" class="fa-solid fa-volume-high"></i> Mensaje de Voz';
            spotifyContainer.innerHTML = `
              <div class="p-3 bg-black/10 rounded-2xl border border-black/5">
                <audio controls class="w-full">
                  <source src="${trackRaw}" type="audio/mpeg">
                </audio>
              </div>`;
              
          } else if (plataforma === 'drive') {
            // Plan de Contingencia: Visor de Google Drive (Iframe Nativo)
            if (lblMusica) lblMusica.innerHTML = '<i id="icon-music" class="fa-brands fa-google-drive"></i> Audio en Drive';
            spotifyContainer.innerHTML = `
              <div class="w-full aspect-video rounded-2xl overflow-hidden shadow-sm bg-black border border-black/5">
                <iframe class="w-full h-full" src="${trackRaw}" frameborder="0" allow="autoplay" allowfullscreen></iframe>
              </div>`;
              
          } else if (plataforma === 'youtube' || plataforma === 'ytmusic') {
            const ytId = extraerYoutubeId(trackRaw);
            const isAudioBar = modoVisual === 'audio';
            if (lblMusica) lblMusica.innerHTML = `<i id="icon-music" class="fa-solid ${isAudioBar ? 'fa-headphones' : 'fa-play'}"></i> ${isAudioBar ? 'Audio' : 'Video'} del Recuerdo`;
            spotifyContainer.innerHTML = `
              <div class="w-full ${isAudioBar ? 'h-20' : 'aspect-video'} rounded-2xl overflow-hidden shadow-sm bg-black border border-black/5">
                <iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&playsinline=1&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
              </div>`;
              
          } else {
            // Spotify
            if (lblMusica) lblMusica.innerHTML = '<i id="icon-music" class="fa-brands fa-spotify"></i> Canción del Recuerdo';
            const cleanSpotifyId = trackRaw.includes('/track/') ? trackRaw.split('/track/')[1].split('?')[0] : trackRaw.trim();
            spotifyContainer.innerHTML = `
              <iframe style="border-radius:16px" src="https://open.spotify.com/embed/track/${cleanSpotifyId}?utm_source=generator&theme=0" width="100%" height="${modoVisual === 'audio' ? '80' : '152'}" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
          }

          if (lblMusica) lblMusica.style.color = colorSubtexto;
          const iconMusic = document.getElementById('icon-music');
          if (iconMusic) iconMusic.style.color = colorPrincipal;

          secSpotify?.classList.remove('hidden');
        }

        // 6. Transición Definitiva: Ocultar Loader y Revelar Tarjeta
        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.setProperty('display', 'none', 'important');
          loader.classList.remove('flex');
          loader.classList.add('hidden');
        }

        if (card) {
          card.classList.remove('hidden');
          card.style.display = 'block';
        }

      } catch (error) {
        console.error("Error al cargar recuerdo:", error);
        document.body.innerHTML = `<p class="text-center text-slate-400 mt-10">Error de conexión al cargar el recuerdo: ${error.message}</p>`;
      }
    }

    cargarRecuerdo();
  </script>
</body>
</html>
