<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuerdo Digital — Sōi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      transition: background-color 0.5s ease;
    }
    .thumb-active {
      border-color: var(--color-principal) !important;
      transform: scale(1.05);
      opacity: 1 !important;
    }
  </style>
</head>
<body id="body-bg" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4 sm:p-6 font-sans">

  <!-- Estado de Carga -->
  <div id="loader" class="flex flex-col items-center justify-center min-h-[60vh]">
    <div id="spinner" class="w-12 h-12 border-4 border-slate-700 border-t-amber-500 rounded-full animate-spin mb-4"></div>
    <p class="text-slate-400 text-sm font-medium">Cargando recuerdo digital...</p>
  </div>

  <!-- Contenedor Principal del Recuerdo -->
  <main id="card-content" class="hidden w-full max-w-md bg-slate-800/90 backdrop-blur-md rounded-3xl p-6 shadow-2xl border border-slate-700/50 space-y-6 my-auto">
    
    <!-- Encabezado y Titular -->
    <header class="text-center space-y-2">
      <span id="subtitulo" class="text-xs uppercase tracking-widest font-semibold text-slate-400 block"></span>
      <h1 id="titulo" class="text-2xl sm:text-3xl font-bold tracking-tight text-white"></h1>
      <div id="divider" class="w-16 h-1 mx-auto rounded-full my-2"></div>
    </header>

    <!-- Galería / Foto Principal -->
    <section id="sec-fotos" class="hidden space-y-3">
      <div class="relative overflow-hidden rounded-2xl shadow-lg aspect-square bg-slate-950 border border-slate-700/50">
        <img id="foto-activa" src="" alt="Recuerdo" class="w-full h-full object-cover transition-all duration-500">
      </div>
      <!-- Miniaturas de la Galería -->
      <div id="carrusel-thumbs" class="flex gap-2 justify-center overflow-x-auto py-1 hidden"></div>
    </section>

    <!-- Dedicatoria y Mensaje Especial -->
    <section id="sec-mensaje" class="hidden space-y-3 text-center bg-slate-900/60 p-4 rounded-2xl border border-slate-700/30">
      <p id="dedicatoria" class="text-sm sm:text-base italic text-slate-200 leading-relaxed"></p>
      <p id="mensaje-especial" class="text-xs text-slate-400 font-light"></p>
    </section>

    <!-- Audio de Voz / Mensaje Grabado -->
    <section id="sec-audio" class="hidden space-y-2">
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <i id="icon-mic" class="fa-solid fa-microphone"></i> Mensaje de Voz
      </p>
      <audio id="reproductor-audio" controls class="w-full rounded-lg bg-slate-900"></audio>
    </section>

    <!-- Música (Spotify / Reproductor Integrado) -->
    <section id="sec-spotify" class="hidden space-y-2">
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <i id="icon-music" class="fa-solid fa-music"></i> Canción del Recuerdo
      </p>
      <div id="spotify-container" class="rounded-2xl overflow-hidden shadow-md bg-slate-950"></div>
    </section>

    <!-- Pie de Página Sōi -->
    <footer class="pt-4 border-t border-slate-700/50 text-center">
      <a href="https://www.soigroupcr.com" target="_blank" class="inline-flex items-center gap-2 text-xs text-slate-500 hover:text-slate-300 transition-colors">
        <span>Conectado por</span>
        <span class="font-bold tracking-wider text-slate-300">SŌI RECUERDOS 3D</span>
      </a>
    </footer>

  </main>

  <!-- Script de Carga y Conexión con Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD20eQRuXkW3ayx5l49lvd8nJ-X7Mar-WA",
      authDomain: "soi-nfc-db.firebaseapp.com",
      projectId: "soi-nfc-db",
      storageBucket: "soi-nfc-db.firebasestorage.app",
      messagingSenderId: "421798963104",
      appId: "1:421798963104:web:d6f0a37729d6d2eb86a6c5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const recuerdoId = urlParams.get('id');

    async function cargarRecuerdo() {
      if (!recuerdoId) {
        document.body.innerHTML = '<p class="text-center text-white mt-10">ID no especificado en la URL.</p>';
        return;
      }

      try {
        const docRef = doc(db, "recuerdos", recuerdoId);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          document.body.innerHTML = '<p class="text-center text-white mt-10">Recuerdo no encontrado en la base de datos.</p>';
          return;
        }

        const info = docSnap.data();

        // 1. Personalización de colores
        const colorPrimary = info.colorPrincipal || '#81D4FA';
        const colorSecondary = info.colorSecundario || '#FFB300';
        const colorBg = info.colorFondo || '#0F172A';

        document.documentElement.style.setProperty('--color-principal', colorPrimary);
        if (document.getElementById('body-bg')) {
          document.getElementById('body-bg').style.backgroundColor = colorBg;
        }

        const divider = document.getElementById('divider');
        if (divider) divider.style.backgroundColor = colorPrimary;

        const iconMic = document.getElementById('icon-mic');
        if (iconMic) iconMic.style.color = colorPrimary;

        const iconMusic = document.getElementById('icon-music');
        if (iconMusic) iconMusic.style.color = colorPrimary;

        // 2. Encabezado
        const elTitulo = document.getElementById('titulo');
        const elSubtitulo = document.getElementById('subtitulo');
        if (elTitulo) elTitulo.textContent = info.titulo || '';
        if (elSubtitulo) elSubtitulo.textContent = info.subtitulo || '';

        // 3. Foto Principal
        const secFotos = document.getElementById('sec-fotos');
        const imgActiva = document.getElementById('foto-activa');
        if (info.fotoPrincipal && imgActiva) {
          imgActiva.src = info.fotoPrincipal;
          secFotos?.classList.remove('hidden');
        }

        // 4. Mensajes y Dedicatoria
        const secMensaje = document.getElementById('sec-mensaje');
        const elDedicatoria = document.getElementById('dedicatoria');
        const elMensajeEsp = document.getElementById('mensaje-especial');
        
        let tieneMensaje = false;
        if (info.dedicatoria && elDedicatoria) {
          elDedicatoria.textContent = `"${info.dedicatoria}"`;
          tieneMensaje = true;
        }
        if (info.mensajeEspecial && elMensajeEsp) {
          elMensajeEsp.textContent = info.mensajeEspecial;
          tieneMensaje = true;
        }
        if (tieneMensaje && secMensaje) {
          secMensaje.classList.remove('hidden');
        }

        // 5. Reproductor de Audio (Spotify o YouTube)
        const trackId = info.audioId || info.spotifyTrackId;
        const plataforma = info.plataformaAudio || 'spotify';
        const secSpotify = document.getElementById('sec-spotify');
        const spotifyContainer = document.getElementById('spotify-container');

        if (trackId && spotifyContainer) {
          if (plataforma === 'youtube' || plataforma === 'ytmusic') {
            spotifyContainer.innerHTML = `<iframe class="w-full aspect-video" src="https://www.youtube-nocookie.com/embed/${trackId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
          } else {
            spotifyContainer.innerHTML = `<iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/${trackId}?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
          }
          secSpotify?.classList.remove('hidden');
        }

        // 6. Ocultar estado de carga y revelar tarjeta completa
        const loader = document.getElementById('loader');
        if (loader) loader.classList.add('hidden');

        const cardContent = document.getElementById('card-content');
        if (cardContent) cardContent.classList.remove('hidden');

      } catch (error) {
        console.error("Error al cargar datos desde Firebase:", error);
        document.body.innerHTML = '<p class="text-center text-white mt-10">Error de conexión al cargar el recuerdo.</p>';
      }
    }

    cargarRecuerdo();
  </script>
</body>
</html>
