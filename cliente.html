<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIVO | Personaliza tu Recuerdo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F0F4F8] min-h-screen font-sans text-slate-800">
  <div class="max-w-2xl mx-auto bg-white min-h-screen shadow-xl sm:my-8 sm:rounded-2xl overflow-hidden">
    <div class="bg-slate-900 px-6 py-10 text-center text-white relative">
      <h1 class="text-3xl font-black tracking-[0.25em] mb-2">V I V O</h1>
      <p class="text-xs text-slate-300 uppercase tracking-widest font-semibold">Portal de Personalización</p>
    </div>

    <div class="p-6 sm:p-10">
      <form id="formCliente" class="space-y-8">
        
        <!-- Contacto -->
        <div class="space-y-4">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 border-b pb-2">Tus Datos</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block text-xs font-bold text-slate-700 mb-1">Nombre Completo</label><input type="text" id="nombreCliente" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 bg-slate-50 text-sm"></div>
            <div><label class="block text-xs font-bold text-slate-700 mb-1">Correo Electrónico</label><input type="email" id="emailCliente" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 bg-slate-50 text-sm"></div>
          </div>
        </div>

        <!-- Textos -->
        <div class="space-y-4">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 border-b pb-2">Textos</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block text-xs font-bold text-slate-700 mb-1">Título</label><input type="text" id="titulo" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 bg-slate-50 text-sm"></div>
            <div><label class="block text-xs font-bold text-slate-700 mb-1">Subtítulo / Fecha</label><input type="text" id="subtitulo" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 bg-slate-50 text-sm"></div>
          </div>
          <div><label class="block text-xs font-bold text-slate-700 mb-1">Dedicatoria</label><textarea id="dedicatoria" required rows="3" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 bg-slate-50 text-sm"></textarea></div>
        </div>

        <!-- Multimedia Mejorada -->
        <div class="space-y-4">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 border-b pb-2">Archivos (Links)</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="md:col-span-1"><label class="block text-xs font-bold text-slate-700 mb-1">Tipo de Foto</label><select id="origenFoto" class="w-full p-3 border rounded-lg bg-white text-sm"><option value="dropbox">Dropbox</option><option value="drive">Google Drive</option></select></div>
            <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-700 mb-1">Enlace de la Foto</label><input type="url" id="fotoPrincipal" required class="w-full p-3 border border-slate-300 rounded-lg text-sm"></div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="md:col-span-1"><label class="block text-xs font-bold text-slate-700 mb-1">Tipo de Audio/Música</label><select id="plataformaAudio" class="w-full p-3 border rounded-lg bg-white text-sm"><option value="spotify">Spotify</option><option value="dropbox">Audio Dropbox (.mp3)</option><option value="drive">Audio Google Drive</option><option value="youtube">YouTube</option></select></div>
            <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-700 mb-1">Enlace de la Canción</label><input type="text" id="audioId" class="w-full p-3 border border-slate-300 rounded-lg text-sm"></div>
          </div>
        </div>

        <!-- Diseño y Estética (NUEVO) -->
        <div class="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 border-b border-slate-300 pb-2">Diseño y Colores</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block text-xs font-bold text-slate-700 mb-1">Letra Título</label><select id="fontTitulo" class="w-full p-2 border rounded bg-white text-sm"><option value="Playfair Display">Playfair Display</option><option value="Dancing Script">Dancing Script (Cursiva)</option><option value="Cinzel">Cinzel</option></select></div>
            <div><label class="block text-xs font-bold text-slate-700 mb-1">Letra Textos</label><select id="fontTexto" class="w-full p-2 border rounded bg-white text-sm"><option value="Lato">Lato</option><option value="Cormorant Garamond">Cormorant Garamond</option></select></div>
          </div>
          <div class="grid grid-cols-3 gap-4 pt-2">
            <div><label class="block text-[10px] font-bold text-slate-700 mb-1 text-center">Fondo</label><input type="color" id="colorFondo" value="#FFFFFF" class="w-full h-10 cursor-pointer border rounded"></div>
            <div><label class="block text-[10px] font-bold text-slate-700 mb-1 text-center">Acentos (Botón)</label><input type="color" id="colorPrincipal" value="#81D4FA" class="w-full h-10 cursor-pointer border rounded"></div>
            <div><label class="block text-[10px] font-bold text-slate-700 mb-1 text-center">Color Textos</label><input type="color" id="colorTexto" value="#1E293B" class="w-full h-10 cursor-pointer border rounded"></div>
          </div>
        </div>

        <!-- Legal -->
        <div class="bg-blue-50/50 border border-blue-100 p-5 rounded-xl space-y-3">
          <h3 class="text-xs font-bold text-blue-900 uppercase">Acuerdo Legal</h3>
          <label class="flex items-start space-x-3 cursor-pointer mt-3">
            <input type="checkbox" required class="mt-0.5 w-4 h-4 text-blue-600 rounded">
            <span class="text-xs font-bold text-slate-700">Acepto los términos de propiedad intelectual y eximo a Sōi Group de responsabilidad por el contenido proporcionado. (Verá los detalles en el PDF adjunto).</span>
          </label>
        </div>

        <button type="submit" id="btnEnviar" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg text-sm tracking-wide">ENVIAR SOLICITUD</button>
      </form>

      <div id="pantallaExito" class="hidden text-center py-10">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">¡Recibido!</h2>
        <p class="text-sm text-slate-600 mb-6">Hemos enviado el Acuerdo en PDF a tu correo.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyD20eQRuXkW3ayx5l49lvd8nJ-X7Mar-WA",
      authDomain: "soi-nfc-db.firebaseapp.com",
      projectId: "soi-nfc-db"
    });
    const db = getFirestore(app);
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-v68bkeXjw4b_KHdK6EFFSAWGDRMlpkCxHuDax-HdtQmuzLuKgWAnUztYlaTpsFu5jA/exec";

    document.getElementById('formCliente').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnEnviar');
      btn.innerText = "GENERANDO PDF..."; btn.disabled = true;

      const datos = {
        nombreCliente: document.getElementById('nombreCliente').value.trim(),
        emailCliente: document.getElementById('emailCliente').value.trim(),
        titulo: document.getElementById('titulo').value.trim(),
        subtitulo: document.getElementById('subtitulo').value.trim(),
        dedicatoria: document.getElementById('dedicatoria').value.trim(),
        origenFoto: document.getElementById('origenFoto').value,
        fotoPrincipal: document.getElementById('fotoPrincipal').value.trim(),
        plataformaAudio: document.getElementById('plataformaAudio').value,
        audioId: document.getElementById('audioId').value.trim(),
        fontTitulo: document.getElementById('fontTitulo').value,
        fontTexto: document.getElementById('fontTexto').value,
        colorFondo: document.getElementById('colorFondo').value,
        colorPrincipal: document.getElementById('colorPrincipal').value,
        colorTexto: document.getElementById('colorTexto').value,
        estado: 'pendiente'
      };

      try {
        await addDoc(collection(db, "solicitudes_pendientes"), datos);
        await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(datos) });
        document.getElementById('formCliente').classList.add('hidden');
        document.getElementById('pantallaExito').classList.remove('hidden');
      } catch (error) {
        alert("Ocurrió un error."); btn.innerText = "INTENTAR DE NUEVO"; btn.disabled = false;
      }
    };
  </script>
</body>
</html>
